
name: Frontend CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run all frontend tests with coverage
        run: |
          set -o pipefail
          npm test -- --coverage --reporter=verbose --reporter=json --outputFile=vitest-results.json 2>&1 | tee vitest-output.txt

      - name: Publish frontend test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend test summary"
            echo
            if [ -f vitest-results.json ]; then
              echo "| Metric | Result |"
              echo "|---|---:|"
              jq -r '"| Test files | " + (.numPassedTestSuites|tostring) + "/" + (.numTotalTestSuites|tostring) + " passed |"' vitest-results.json
              jq -r '"| Tests | " + (.numPassedTests|tostring) + "/" + (.numTotalTests|tostring) + " passed |"' vitest-results.json
              jq -r '"| Failed tests | " + (.numFailedTests|tostring) + " |"' vitest-results.json
              echo
              echo "### Executed tests"
              jq -r '.testResults[] | "- `" + .name + "`: " + ((.assertionResults | length)|tostring) + " tests"' vitest-results.json
            else
              echo "Vitest did not produce a JSON report."
            fi
            echo
            echo "### Coverage"
            if [ -f coverage/coverage-summary.json ]; then
              jq -r '"| Metric | Covered |"| "|---|---:|" "| Statements | " + (.total.statements.pct|tostring) + "% |" "| Branches | " + (.total.branches.pct|tostring) + "% |" "| Functions | " + (.total.functions.pct|tostring) + "% |" "| Lines | " + (.total.lines.pct|tostring) + "% |"' coverage/coverage-summary.json
            else
              echo "Coverage summary was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            coverage/
            dist/
            vitest-results.json
            vitest-output.txt
          if-no-files-found: warn
