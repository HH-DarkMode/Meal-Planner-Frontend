
name: Frontend CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run all frontend tests with coverage
        run: npm test -- --coverage --reporter=verbose

      - name: Publish frontend test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend test summary"
            echo
            echo "Executed command: \`npm test -- --coverage --reporter=verbose\`"
            echo
            echo "The full Vitest output is available in the CI log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            coverage/
            dist/
          if-no-files-found: warn
